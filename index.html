<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TiVoo — For You</title>
  <style>
    :root {
      --bg: #0b0912;
      --surface: #151026;
      --surface-2: #1f1838;
      --accent: #ff2e63;
      --accent-2: #ff9f1c;
      --text: #ffffff;
      --muted: #b8b3ce;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: #0b0912;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 860px;
      position: relative;
      overflow: hidden;
      background: #141022;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.8);
    }

    @media (min-width: 480px) {
      .phone-frame {
        height: 92vh;
        border-radius: 30px;
        border: 1px solid var(--border);
      }
    }

    /* Toast */
    .toast {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(-18px);
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      max-width: 92%;
      text-align: center;
      box-shadow: 0 8px 25px rgba(255, 46, 99, 0.45);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Auth Overlay */
    .auth-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #140f26 0%, #08060e 100%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 22px;
      gap: 14px;
      overflow-y: auto;
    }

    .auth-screen.hidden {
      display: none;
    }

    .auth-title {
      text-align: center;
      font-size: 25px;
      font-weight: 800;
    }

    .auth-sub {
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: -6px;
    }

    .auth-switch {
      display: flex;
      background: var(--surface);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .auth-switch button {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .auth-switch button.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gender-row {
      display: flex;
      gap: 10px;
    }

    .gender-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .gender-option input {
      accent-color: var(--accent);
    }

    .input-field,
    select.input-field {
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .primary-btn {
      padding: 11px 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-btn {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .bonus-note {
      background: rgba(255, 159, 28, 0.12);
      border: 1px solid rgba(255, 159, 28, 0.3);
      color: #ffd089;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 11.5px;
      text-align: center;
      line-height: 1.4;
    }

    /* Views */
    .view {
      position: absolute;
      inset: 0 0 64px 0;
      display: none;
      flex-direction: column;
      background: var(--bg);
    }

    .view.active {
      display: flex;
    }

    /* Top Header (Reference For You Look) */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 18px 16px 14px;
      background: linear-gradient(
        to bottom,
        rgba(15, 11, 26, 0.85) 0%,
        rgba(15, 11, 26, 0.35) 65%,
        transparent 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: auto;
    }

    .brand-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .cat-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #ffd98e;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .tabs {
      display: flex;
      gap: 24px;
      pointer-events: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15.5px;
      font-weight: 600;
      padding-bottom: 5px;
      cursor: pointer;
      position: relative;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    .tab-btn.active {
      color: #ffffff;
      font-weight: 700;
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 18%;
      right: 18%;
      height: 2.5px;
      border-radius: 999px;
      background: #ffffff;
    }

    /* Vertical For You Feed */
    .feed {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }

    .reel-card {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #291c42 0%, #110d1d 75%, #090710 100%);
    }

    .reel-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reel-poster {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13.5px;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    .reel-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(10, 7, 18, 0.84) 0%,
        rgba(10, 7, 18, 0.14) 32%,
        transparent 65%,
        rgba(15, 11, 26, 0.42) 100%
      );
      pointer-events: none;
    }

    /* Right Side Action Icons */
    .actions {
      position: absolute;
      right: 12px;
      bottom: 24px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-box {
      position: relative;
      margin-bottom: 6px;
    }

    .avatar-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #322752, #151026);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
    }

    .plus-badge {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: #ff2e63;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
    }

    .act-btn {
      background: none;
      border: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    .act-ico {
      font-size: 30px;
      line-height: 1.05;
      color: rgba(255, 255, 255, 0.94);
    }

    .act-btn.liked .act-ico {
      color: #ff2e63;
    }

    .sound-disc {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, #181818 28%, #ff2e63 32%, #181818 36%, #2b2b2b 100%);
      border: 5px solid rgba(35, 30, 50, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      margin-top: 2px;
    }

    /* Bottom Left Sound Line */
    .bottom-info {
      position: absolute;
      left: 14px;
      right: 76px;
      bottom: 24px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .sound-line {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Sub-pages */
    .page-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-header h2 {
      font-size: 18px;
      font-weight: 800;
    }

    .page-body {
      padding: 14px 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cat-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip-btn {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip-btn.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: transparent;
    }

    .auto-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .auto-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .auto-item strong {
      font-size: 12.5px;
      display: block;
    }

    .auto-item span {
      font-size: 11px;
      color: var(--muted);
    }

    .use-tag-btn {
      padding: 6px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #ffd98e;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .notif-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 11px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 12.5px;
      line-height: 1.35;
    }

    .notif-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 46, 99, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .profile-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
    }

    .profile-pic {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 8px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-box strong {
      display: block;
      font-size: 17px;
    }

    .stat-box span {
      font-size: 11.5px;
      color: var(--muted);
    }

    .logout-btn {
      background: rgba(255, 46, 99, 0.16);
      color: #ff6b91;
      border: 1px solid rgba(255, 46, 99, 0.35);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .hidden-panel {
      display: none !important;
    }

    .admin-card {
      background: var(--surface);
      border: 1px solid rgba(255, 159, 28, 0.35);
      border-radius: 16px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .admin-card h4 {
      font-size: 13.5px;
      color: #ffd089;
    }

    .admin-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: linear-gradient(to top, #08060e, #100c1c);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
    }

    .nav-item {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-size: 10.5px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      min-width: 52px;
    }

    .nav-item .ico {
      font-size: 19px;
      line-height: 1;
    }

    .nav-item.active {
      color: #ffffff;
      font-weight: 700;
    }

    .upload-plus {
      width: 48px;
      height: 31px;
      border-radius: 9px;
      border: none;
      background: #ffffff;
      color: #0d0a14;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: -3px 0 0 #00f2ea, 3px 0 0 #ff2e63;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Drawers */
    .drawer {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 60;
      display: none;
      align-items: flex-end;
    }

    .drawer.open {
      display: flex;
    }

    .drawer-box {
      width: 100%;
      max-height: 78%;
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      border-top: 1px solid var(--border);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
    }

    .comment-list {
      overflow-y: auto;
      max-height: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.06);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
    }

    .comment-item strong {
      color: var(--accent-2);
      margin-right: 6px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="toast" id="toast"></div>

    <!-- AUTH SCREEN (Sign Up / Sign In) -->
    <div class="auth-screen" id="authScreen">
      <div class="auth-title">Welcome to TiVoo</div>
      <div class="auth-sub">Create, watch & share short videos</div>

      <div class="auth-switch">
        <button type="button" class="active" id="modeSignUp">Sign Up</button>
        <button type="button" id="modeSignIn">Sign In</button>
      </div>

      <form class="auth-form" id="authForm">
        <input class="input-field" type="text" id="authName" placeholder="Full Name" required />
        <input class="input-field" type="text" id="authUsername" placeholder="Username" required />
        <input class="input-field" type="password" id="authPassword" placeholder="Password" required />

        <div class="gender-row" id="genderRow">
          <label class="gender-option">
            <input type="radio" name="gender" value="Male" checked />
            <span>♂ Male</span>
          </label>
          <label class="gender-option">
            <input type="radio" name="gender" value="Female" />
            <span>♀ Female</span>
          </label>
        </div>

        <button class="primary-btn" type="submit" id="authSubmitBtn">Create Account</button>
      </form>

      <div class="bonus-note">
        🎁 <strong>First Sign In:</strong> <strong>10 followers</strong> • <strong>First Video:</strong> <strong>15 likes & 5 comments</strong>
      </div>
    </div>

    <!-- FOR YOU / HOME VIEW -->
    <div class="view active" id="viewHome">
      <div class="top-header">
        <div class="brand">
          <svg width="26" height="26" viewBox="0 0 36 36" fill="none">
            <defs>
              <linearGradient id="tvGrad" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ff2e63" />
                <stop offset="100%" stop-color="#ff9f1c" />
              </linearGradient>
            </defs>
            <path d="M6 7H22C27.5 7 31 11.2 31 16.5C31 21.8 27.5 26 22 26H16V31H10V13H6V7Z" fill="url(#tvGrad)" />
            <path d="M17 13L25 17.5L17 22V13Z" fill="#ffffff" />
          </svg>
          <span class="brand-text">TiVoo</span>
          <span class="cat-pill" id="feedCatPill">All</span>
        </div>
        <div class="tabs">
          <button class="tab-btn" id="tabFollowing">Following</button>
          <button class="tab-btn active" id="tabForYou">For You</button>
        </div>
      </div>

      <div class="feed" id="forYouFeed"></div>
    </div>

    <!-- SEARCH & AUTO SONG / NAAT / SOUND VIEW -->
    <div class="view" id="viewSearch">
      <div class="page-header">
        <h2>Song • Naat • Sound</h2>
      </div>
      <div class="page-body">
        <input class="input-field" type="text" id="searchInput" placeholder="Search Song, Naat, Sound..." />
        <div class="cat-chips" id="catChips"></div>
        <div class="auto-list" id="autoCatalogList"></div>
      </div>
    </div>

    <!-- INBOX VIEW -->
    <div class="view" id="viewInbox">
      <div class="page-header">
        <h2>Inbox</h2>
      </div>
      <div class="page-body" id="inboxList"></div>
    </div>

    <!-- PROFILE VIEW (Hidden Admin Unlock) -->
    <div class="view" id="viewProfile">
      <div class="page-header">
        <h2 id="profileHandle">@user</h2>
        <button class="logout-btn" id="logoutBtn">Log Out</button>
      </div>
      <div class="page-body">
        <div class="profile-hero">
          <div class="profile-pic" id="profileAvatar">U</div>
          <h3 id="profileName">User Name</h3>
          <p style="font-size:12px; color:var(--muted)" id="profileGender">Male</p>
        </div>

        <div class="stats-row">
          <div class="stat-box">
            <strong id="statFollowing">0</strong>
            <span>Following</span>
          </div>
          <div class="stat-box">
            <strong id="statFollowers">10</strong>
            <span>Followers</span>
          </div>
          <div class="stat-box">
            <strong id="statLikes">0</strong>
            <span>Likes</span>
          </div>
        </div>

        <!-- Hidden Admin Gate (No hint shown) -->
        <button class="secondary-btn" id="toggleAdminGateBtn">Creator Tools</button>

        <form class="admin-card hidden-panel" id="adminGateForm">
          <input class="input-field" type="text" id="adminUserInput" placeholder="Access ID" autocomplete="off" />
          <input class="input-field" type="password" id="adminPassInput" placeholder="Passcode" autocomplete="off" />
          <button class="primary-btn" type="submit">Unlock</button>
        </form>

        <!-- Hidden Admin Control Panel -->
        <div class="admin-card hidden-panel" id="adminControlPanel">
          <h4>Admin Control</h4>
          <select class="input-field" id="adminTargetSelect"></select>
          <div class="admin-grid-2">
            <input class="input-field" type="number" id="adminLikesInput" value="15" min="1" />
            <button class="secondary-btn" id="adminAddLikesBtn">+ Likes</button>
          </div>
          <div class="admin-grid-2">
            <input class="input-field" type="number" id="adminFollowersInput" value="10" min="1" />
            <button class="secondary-btn" id="adminAddFollowersBtn">+ Followers</button>
          </div>
          <button class="secondary-btn" id="adminEngageBtn">Auto Like & Comment</button>
          <button class="logout-btn" id="lockAdminBtn">Lock</button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
      <button class="nav-item active" data-view="Home"><span class="ico">🏠</span><span>Home</span></button>
      <button class="nav-item" data-view="Search"><span class="ico">🔍</span><span>Search</span></button>
      <button class="upload-plus" id="openUploadBtn" title="Post">+</button>
      <button class="nav-item" data-view="Inbox"><span class="ico">💬</span><span>Inbox</span></button>
      <button class="nav-item" data-view="Profile"><span class="ico">👤</span><span>User</span></button>
    </div>

    <!-- COMMENTS DRAWER -->
    <div class="drawer" id="commentDrawer">
      <div class="drawer-box">
        <div class="drawer-header">
          <span id="commentTitle">Comments</span>
          <button class="close-btn" id="closeCommentsBtn">✕</button>
        </div>
        <div class="comment-list" id="commentList"></div>
        <form class="comment-form" id="commentForm">
          <input class="input-field" type="text" id="commentInput" placeholder="Write a comment..." required />
          <button class="primary-btn" type="submit">Post</button>
        </form>
      </div>
    </div>

    <!-- UPLOAD DRAWER -->
    <div class="drawer" id="uploadDrawer">
      <div class="drawer-box">
        <div class="drawer-header">
          <span>Post to For You</span>
          <button class="close-btn" id="closeUploadBtn">✕</button>
        </div>
        <form class="auth-form" id="uploadForm">
          <input class="input-field" type="file" id="uploadFile" accept="video/*" required />
          <select class="input-field" id="uploadCategory">
            <option value="Song">Song</option>
            <option value="Naat">Naat</option>
            <option value="Sound">Sound</option>
          </select>
          <input class="input-field" type="text" id="uploadCaption" placeholder="Caption..." required />
          <input class="input-field" type="text" id="uploadSound" placeholder="Sound / Track title (optional)" />
          <button class="primary-btn" type="submit">Publish</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_USERS = "tivoo_users_fy_v1";
    const STORAGE_CURRENT = "tivoo_current_fy_v1";
    const STORAGE_AUTO_ITEMS = "tivoo_auto_catalog_fy_v1";

    // Hidden Admin Credentials
    const ADMIN_ID = "tivoo85";
    const ADMIN_PASS = "tivoo6974";

    const AUTO_CATEGORIES = ["Song", "Naat", "Sound"];

    const AUTO_COMMENT_TEXTS = [
      "Nice! 🔥",
      "So good! 👏",
      "Love this! ❤️",
      "Clean vibe! ✨",
      "Awesome! 🚀"
    ];

    function getDayStamp() {
      const n = new Date();
      return `${n.getFullYear()}-${n.getMonth() + 1}-${n.getDate()}`;
    }

    // Automatically generate Song, Naat, and Sound entries
    function getAutoCatalog() {
      const stamp = getDayStamp();
      const saved = JSON.parse(localStorage.getItem(STORAGE_AUTO_ITEMS) || "null");
      if (saved && saved.stamp === stamp) return saved.items;

      const items = [
        { id: 101, kind: "Song", title: "TiVoo Original Song #1", tag: "Song" },
        { id: 102, kind: "Song", title: "TiVoo Original Song #2", tag: "Song" },
        { id: 201, kind: "Naat", title: "Subhan Allah Naat Track #1", tag: "Naat" },
        { id: 202, kind: "Naat", title: "Kalam-e-Paak Naat Track #2", tag: "Naat" },
        { id: 301, kind: "Sound", title: "TiVoo Original Sound #1", tag: "Sound" },
        { id: 302, kind: "Sound", title: "TiVoo Original Sound #2", tag: "Sound" }
      ];

      localStorage.setItem(STORAGE_AUTO_ITEMS, JSON.stringify({ stamp, items }));
      return items;
    }

    const autoCatalog = getAutoCatalog();

    let reels = [
      {
        id: 1,
        creator: "T",
        user: "@tivoo",
        category: "Sound",
        caption: "TiVoo For You",
        sound: "TiVoo Original Sound",
        likes: 15,
        comments: [],
        shares: 1,
        liked: false,
        following: false,
        src: ""
      }
    ];

    let currentUser = null;
    let authMode = "signup";
    let activeTab = "foryou";
    let activeCategory = "All";
    let activeCommentReelId = null;
    let adminUnlocked = false;

    function formatShort(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1000) return Math.round(n / 1000) + "K";
      return String(n);
    }

    const toastEl = document.getElementById("toast");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2800);
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");
    }

    function saveUsers(u) {
      localStorage.setItem(STORAGE_USERS, JSON.stringify(u));
    }

    function persistUser() {
      if (!currentUser) return;
      const users = getUsers();
      users[currentUser.username] = currentUser;
      saveUsers(users);
      localStorage.setItem(STORAGE_CURRENT, currentUser.username);
    }

    function ensureAutoAccounts(userObj) {
      const users = getUsers();
      const handles = [];
      for (let i = 1; i <= 5; i++) {
        const h = `acct_${userObj.username}_${i}`;
        if (!users[h]) {
          users[h] = {
            username: h,
            name: `User ${i}`,
            gender: i % 2 === 0 ? "Female" : "Male",
            followers: 10,
            following: 0,
            autoAccount: true
          };
        }
        handles.push(h);
      }
      saveUsers(users);
      return handles;
    }

    // Auth Screen
    const authScreen = document.getElementById("authScreen");
    const modeSignUp = document.getElementById("modeSignUp");
    const modeSignIn = document.getElementById("modeSignIn");
    const authName = document.getElementById("authName");
    const genderRow = document.getElementById("genderRow");
    const authSubmitBtn = document.getElementById("authSubmitBtn");

    modeSignUp.onclick = () => {
      authMode = "signup";
      modeSignUp.classList.add("active");
      modeSignIn.classList.remove("active");
      authName.style.display = "block";
      authName.required = true;
      genderRow.style.display = "flex";
      authSubmitBtn.textContent = "Create Account";
    };

    modeSignIn.onclick = () => {
      authMode = "signin";
      modeSignIn.classList.add("active");
      modeSignUp.classList.remove("active");
      authName.style.display = "none";
      authName.required = false;
      genderRow.style.display = "none";
      authSubmitBtn.textContent = "Sign In";
    };

    document.getElementById("authForm").onsubmit = e => {
      e.preventDefault();
      const username = document.getElementById("authUsername").value.trim().toLowerCase().replace(/^@/, "");
      const password = document.getElementById("authPassword").value.trim();
      const name = authName.value.trim() || username;
      const gender = document.querySelector('input[name="gender"]:checked')?.value || "Male";
      if (!username || !password) return;

      const users = getUsers();

      if (authMode === "signup") {
        if (users[username]) {
          showToast("Account already exists. Please Sign In.");
          return;
        }
        currentUser = {
          username,
          name,
          gender,
          password,
          followers: 10,
          following: 0,
          firstVideoDone: false,
          notifications: [
            "🎉 10 followers added on first sign in.",
            "🎵 Song, Naat & Sound items added automatically."
          ]
        };
        users[username] = currentUser;
        saveUsers(users);
        ensureAutoAccounts(currentUser);
        localStorage.setItem(STORAGE_CURRENT, username);
        openMain("🎉 Welcome! 10 followers added.");
      } else {
        const found = users[username];
        if (!found || found.password !== password) {
          showToast("Invalid username or password.");
          return;
        }
        if (typeof found.followers !== "number" || found.followers < 10) {
          found.followers = 10;
        }
        currentUser = found;
        ensureAutoAccounts(currentUser);
        users[username] = currentUser;
        saveUsers(users);
        localStorage.setItem(STORAGE_CURRENT, username);
        openMain(`Signed in as @${currentUser.username}`);
      }
    };

    function openMain(msg) {
      authScreen.classList.add("hidden");
      renderFeed();
      renderSearch();
      renderInbox();
      renderProfile();
      if (msg) showToast(msg);
    }

    document.getElementById("logoutBtn").onclick = () => {
      adminUnlocked = false;
      document.getElementById("adminControlPanel").classList.add("hidden-panel");
      document.getElementById("adminGateForm").classList.add("hidden-panel");
      localStorage.removeItem(STORAGE_CURRENT);
      currentUser = null;
      document.getElementById("authForm").reset();
      authScreen.classList.remove("hidden");
      switchView("Home");
      showToast("Logged out");
    };

    // Navigation
    function switchView(name) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById(`view${name}`).classList.add("active");
      document.querySelectorAll(".nav-item").forEach(n => {
        n.classList.toggle("active", n.dataset.view === name);
      });
      if (name === "Search") renderSearch();
      if (name === "Inbox") renderInbox();
      if (name === "Profile") renderProfile();
    }

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.onclick = () => switchView(btn.dataset.view);
    });

    // For You Feed
    const feedEl = document.getElementById("forYouFeed");
    const feedCatPill = document.getElementById("feedCatPill");

    function renderFeed() {
      feedCatPill.textContent = activeCategory;

      let list = activeTab === "following"
        ? reels.filter(r => r.following)
        : reels;

      if (activeCategory !== "All") {
        list = list.filter(r => r.category === activeCategory);
      }

      feedEl.innerHTML = "";

      if (!list.length) {
        feedEl.innerHTML = `
          <div class="reel-card">
            <div class="reel-scrim"></div>
            <div class="reel-poster">
              <div style="font-size:34px;">🎬</div>
              <div>Tap + below to post in ${activeCategory}</div>
            </div>
          </div>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "reel-card";
        card.innerHTML = `
          ${item.src ? `<video src="${item.src}" loop playsinline autoplay muted controls></video>` : `
            <div class="reel-poster">
              <div style="font-size:38px;">🎬</div>
              <div>Tap + below to play your video in For You</div>
            </div>
          `}
          <div class="reel-scrim"></div>

          <div class="bottom-info">
            <div class="sound-line">♫ <span>${item.sound}</span> ♫</div>
          </div>

          <div class="actions">
            <div class="avatar-box">
              <div class="avatar-circle">${item.creator}</div>
              <button class="plus-badge" data-follow="${item.id}">${item.following ? "✓" : "+"}</button>
            </div>

            <button class="act-btn ${item.liked ? "liked" : ""}" data-like="${item.id}">
              <span class="act-ico">${item.liked ? "♥" : "♡"}</span>
              <span>${formatShort(item.likes)}</span>
            </button>

            <button class="act-btn" data-comment="${item.id}">
              <span class="act-ico">💬</span>
              <span>${formatShort(item.comments.length)}</span>
            </button>

            <button class="act-btn" data-share="${item.id}">
              <span class="act-ico">➤</span>
              <span>${formatShort(item.shares)}</span>
            </button>

            <div class="sound-disc">♪</div>
          </div>
        `;
        feedEl.appendChild(card);
      });
    }

    feedEl.addEventListener("click", e => {
      const likeBtn = e.target.closest("[data-like]");
      const followBtn = e.target.closest("[data-follow]");
      const commentBtn = e.target.closest("[data-comment]");
      const shareBtn = e.target.closest("[data-share]");

      if (likeBtn) {
        const reel = reels.find(r => r.id === Number(likeBtn.dataset.like));
        if (reel) {
          reel.liked = !reel.liked;
          reel.likes += reel.liked ? 1 : -1;
          renderFeed();
          renderProfile();
        }
      }

      if (followBtn) {
        const reel = reels.find(r => r.id === Number(followBtn.dataset.follow));
        if (reel && currentUser) {
          reel.following = !reel.following;
          currentUser.following = Math.max(0, currentUser.following + (reel.following ? 1 : -1));
          persistUser();
          renderFeed();
          renderProfile();
        }
      }

      if (commentBtn) {
        activeCommentReelId = Number(commentBtn.dataset.comment);
        openCommentDrawer(activeCommentReelId);
      }

      if (shareBtn) {
        const reel = reels.find(r => r.id === Number(shareBtn.dataset.share));
        if (reel) {
          reel.shares += 1;
          renderFeed();
          showToast("Link copied");
        }
      }
    });

    // Comments
    const commentDrawer = document.getElementById("commentDrawer");
    function openCommentDrawer(id) {
      const reel = reels.find(r => r.id === id);
      if (!reel) return;
      document.getElementById("commentTitle").textContent = `Comments (${reel.comments.length})`;
      document.getElementById("commentList").innerHTML = reel.comments.length
        ? reel.comments.map(c => `<div class="comment-item"><strong>${c.author}</strong>${c.text}</div>`).join("")
        : `<p style="color:var(--muted); font-size:12.5px;">No comments yet.</p>`;
      commentDrawer.classList.add("open");
    }

    document.getElementById("closeCommentsBtn").onclick = () => commentDrawer.classList.remove("open");

    document.getElementById("commentForm").onsubmit = e => {
      e.preventDefault();
      const input = document.getElementById("commentInput");
      const text = input.value.trim();
      const reel = reels.find(r => r.id === activeCommentReelId);
      if (text && reel && currentUser) {
        reel.comments.push({ author: `@${currentUser.username}`, text });
        input.value = "";
        openCommentDrawer(reel.id);
        renderFeed();
      }
    };

    // Upload (+ First Video 15 Likes & 5 Comments)
    const uploadDrawer = document.getElementById("uploadDrawer");
    document.getElementById("openUploadBtn").onclick = () => uploadDrawer.classList.add("open");
    document.getElementById("closeUploadBtn").onclick = () => uploadDrawer.classList.remove("open");

    document.getElementById("uploadForm").onsubmit = e => {
      e.preventDefault();
      if (!currentUser) return;

      const file = document.getElementById("uploadFile").files[0];
      const category = document.getElementById("uploadCategory").value;
      const caption = document.getElementById("uploadCaption").value.trim();
      const sound = document.getElementById("uploadSound").value.trim() || `${category} Original Sound`;
      if (!file) return;

      const autoHandles = ensureAutoAccounts(currentUser);
      const isFirst = !currentUser.firstVideoDone;
      const startLikes = isFirst ? 15 : 0;
      const startComments = isFirst
        ? [0, 1, 2, 3, 4].map(i => ({
            author: `@${autoHandles[i]}`,
            text: AUTO_COMMENT_TEXTS[i]
          }))
        : [];

      if (isFirst) {
        currentUser.firstVideoDone = true;
        currentUser.notifications.unshift("🎉 First Video Bonus: 15 likes & 5 comments added.");
        persistUser();
      }

      reels.unshift({
        id: Date.now(),
        creator: (currentUser.name[0] || "U").toUpperCase(),
        user: `@${currentUser.username}`,
        category,
        caption,
        sound,
        likes: startLikes,
        comments: startComments,
        shares: 0,
        liked: false,
        following: true,
        src: URL.createObjectURL(file)
      });

      e.target.reset();
      uploadDrawer.classList.remove("open");
      activeTab = "foryou";
      activeCategory = "All";
      document.getElementById("tabForYou").classList.add("active");
      document.getElementById("tabFollowing").classList.remove("active");
      switchView("Home");
      renderFeed();
      renderProfile();
      feedEl.scrollTo({ top: 0, behavior: "smooth" });
      showToast(isFirst ? "🎉 +15 Likes & +5 Comments added!" : "Published");
    };

    // Tabs
    document.getElementById("tabForYou").onclick = () => {
      activeTab = "foryou";
      document.getElementById("tabForYou").classList.add("active");
      document.getElementById("tabFollowing").classList.remove("active");
      renderFeed();
    };

    document.getElementById("tabFollowing").onclick = () => {
      activeTab = "following";
      document.getElementById("tabFollowing").classList.add("active");
      document.getElementById("tabForYou").classList.remove("active");
      renderFeed();
    };

    // Search & Auto Song / Naat / Sound Catalog
    const searchInput = document.getElementById("searchInput");
    const catChipsEl = document.getElementById("catChips");
    const autoCatalogListEl = document.getElementById("autoCatalogList");

    function renderSearch(q = "") {
      const chips = ["All", ...AUTO_CATEGORIES];
      catChipsEl.innerHTML = chips.map(c => `
        <button class="chip-btn ${activeCategory === c ? "active" : ""}" data-c="${c}">${c}</button>
      `).join("");

      catChipsEl.querySelectorAll(".chip-btn").forEach(b => {
        b.onclick = () => {
          activeCategory = b.dataset.c;
          renderSearch(searchInput.value);
          renderFeed();
        };
      });

      const query = q.toLowerCase();
      const filtered = autoCatalog.filter(item => {
        const matchCat = activeCategory === "All" || item.kind === activeCategory;
        const matchQuery = item.title.toLowerCase().includes(query) || item.kind.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      autoCatalogListEl.innerHTML = filtered.map(item => `
        <div class="auto-item">
          <div>
            <strong>${item.title}</strong>
            <span>${item.kind}</span>
          </div>
          <button class="use-tag-btn" data-select-kind="${item.kind}" data-select-title="${item.title}">Use</button>
        </div>
      `).join("");
    }

    autoCatalogListEl.addEventListener("click", e => {
      const btn = e.target.closest("[data-select-kind]");
      if (!btn) return;
      document.getElementById("uploadCategory").value = btn.dataset.selectKind;
      document.getElementById("uploadSound").value = btn.dataset.selectTitle;
      activeCategory = btn.dataset.selectKind;
      renderSearch(searchInput.value);
      renderFeed();
      uploadDrawer.classList.add("open");
    });

    searchInput.oninput = e => renderSearch(e.target.value);

    // Inbox
    function renderInbox() {
      if (!currentUser) return;
      document.getElementById("inboxList").innerHTML = currentUser.notifications.map(n => `
        <div class="notif-item">
          <div class="notif-icon">🔔</div>
          <div>${n}</div>
        </div>
      `).join("");
    }

    // Profile & Hidden Admin Unlock
    const gateForm = document.getElementById("adminGateForm");
    const adminPanel = document.getElementById("adminControlPanel");

    document.getElementById("toggleAdminGateBtn").onclick = () => {
      if (adminUnlocked) {
        adminPanel.classList.toggle("hidden-panel");
      } else {
        gateForm.classList.toggle("hidden-panel");
      }
    };

    gateForm.onsubmit = e => {
      e.preventDefault();
      const u = document.getElementById("adminUserInput").value.trim();
      const p = document.getElementById("adminPassInput").value.trim();
      if (u === ADMIN_ID && p === ADMIN_PASS) {
        adminUnlocked = true;
        gateForm.reset();
        gateForm.classList.add("hidden-panel");
        adminPanel.classList.remove("hidden-panel");
        renderProfile();
        showToast("Unlocked");
      } else {
        showToast("Invalid credentials");
      }
    };

    document.getElementById("lockAdminBtn").onclick = () => {
      adminUnlocked = false;
      adminPanel.classList.add("hidden-panel");
    };

    function renderProfile() {
      if (!currentUser) return;
      const myReels = reels.filter(r => r.user === `@${currentUser.username}`);
      const totalLikes = myReels.reduce((sum, r) => sum + r.likes, 0);

      document.getElementById("profileHandle").textContent = `@${currentUser.username}`;
      document.getElementById("profileAvatar").textContent = (currentUser.name[0] || "U").toUpperCase();
      document.getElementById("profileName").textContent = currentUser.name;
      document.getElementById("profileGender").textContent = currentUser.gender || "Male";
      document.getElementById("statFollowing").textContent = currentUser.following;
      document.getElementById("statFollowers").textContent = formatShort(currentUser.followers);
      document.getElementById("statLikes").textContent = formatShort(totalLikes);

      const sel = document.getElementById("adminTargetSelect");
      sel.innerHTML = reels.map(r => `<option value="${r.id}">${r.user} — ${r.sound}</option>`).join("");
    }

    document.getElementById("adminAddLikesBtn").onclick = () => {
      if (!adminUnlocked) return;
      const id = Number(document.getElementById("adminTargetSelect").value);
      const add = Math.max(1, Number(document.getElementById("adminLikesInput").value) || 0);
      const r = reels.find(item => item.id === id);
      if (r) {
        r.likes += add;
        renderFeed();
        renderProfile();
        showToast(`+${add} likes`);
      }
    };

    document.getElementById("adminAddFollowersBtn").onclick = () => {
      if (!adminUnlocked || !currentUser) return;
      const add = Math.max(1, Number(document.getElementById("adminFollowersInput").value) || 0);
      currentUser.followers += add;
      persistUser();
      renderProfile();
      showToast(`+${add} followers`);
    };

    document.getElementById("adminEngageBtn").onclick = () => {
      if (!adminUnlocked || !currentUser) return;
      const id = Number(document.getElementById("adminTargetSelect").value);
      const r = reels.find(item => item.id === id);
      const handles = ensureAutoAccounts(currentUser);
      if (r) {
        r.likes += 5;
        const pick = handles[Math.floor(Math.random() * handles.length)];
        r.comments.push({
          author: `@${pick}`,
          text: AUTO_COMMENT_TEXTS[Math.floor(Math.random() * AUTO_COMMENT_TEXTS.length)]
        });
        renderFeed();
        renderProfile();
        showToast("Engaged");
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem(STORAGE_CURRENT);
      const users = getUsers();
      if (savedUser && users[savedUser]) {
        currentUser = users[savedUser];
        ensureAutoAccounts(currentUser);
        openMain();
      }
    });
  </script>
</body>
</html>
